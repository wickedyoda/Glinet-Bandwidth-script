name: Security Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in *.sh; do
            sh -n "$f" || exit 1
          done

      - name: ShellCheck
        uses: ludeeus/shellcheck-docker@v2
        with:
          scripts: |
            glinet-vlan-qos.sh
            glinet-vlan-qos-setup.sh
            install.sh

      - name: Checksum verification
        run: sha256sum -c checksums.txt

      - name: Secrets scan
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rniE '(api_key|apikey|secret|password|passwd|token|bearer|credential|private_key)' *.sh 2>/dev/null; then
            echo "❌ Secrets found!" && exit 1
          else
            echo "✅ No secrets found"
          fi

      - name: Supply chain check
        run: |
          echo "Checking for unauthorized external URLs..."
          if grep -rn 'https\?://' *.sh 2>/dev/null | grep -v 'raw.githubusercontent.com/wickedyoda/Glinet-Bandwidth-script'; then
            echo "❌ Unauthorized external URL found!" && exit 1
          else
            echo "✅ All URLs point to authorized sources"
          fi

      - name: Command injection check
        run: |
          echo "Checking for dangerous patterns..."
          if grep -rniE '(eval|system\(|popen\(|exec\()' *.sh 2>/dev/null | grep -v '^install.sh'; then
            echo "❌ Dangerous command patterns found!" && exit 1
          else
            echo "✅ No dangerous patterns"
          fi

      - name: File permissions check
        run: |
          echo "Checking file permissions..."
          for f in *.sh; do
            perms=$(stat -c '%a' "$f")
            if [ "$perms" != "755" ]; then
              echo "❌ Wrong permissions on $f: $perms"
              exit 1
            fi
          done
          echo "✅ File permissions correct (755)"